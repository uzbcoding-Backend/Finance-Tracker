<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><meta name="description" content="A simple income and expense tracker stored only in your browser."><title>Finance Tracker</title><link rel="stylesheet" href="style.css"></head><body><header><p>OPEN SOURCE · WEB APPLICATION</p><h1>Finance Tracker</h1><p>A simple income and expense tracker stored only in your browser.</p></header><main><section class="panel"><h2>Transactions</h2><form id="form"><input id="label" placeholder="Description" required><input id="amount" type="number" step="0.01" min="0.01" required placeholder="Amount"><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><button>Add</button></form><h3 id="balance"></h3><ul id="list"></ul><p>Demo data is stored locally. This is not a banking app.</p></section></main><footer>Built with HTML, CSS and JavaScript · Finance Tracker</footer><script src="app.js" defer></script></body></html>
